name: Deploy Docs

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'gkd-docs/**'
      - 'gkd-api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/deloy-docs.yml'

permissions:
  id-token: write
  contents: write

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - run: pnpm -F @gkd-kit/docs exec node ./.vitepress/scripts/updateVersion.ts

      - run: pnpm -F @gkd-kit/api run docs:build
      - run: pnpm -F @gkd-kit/docs run docs:build-mirror

      - run: pnpm -F @gkd-kit/docs publish --no-git-checks

      - run: >-
          pnpm dlx --allow-build=sharp --allow-build=workerd wrangler@4.118.0
          pages deploy ./gkd-docs/.vitepress/dist --project-name=gkd-docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: nwtgck/actions-netlify@v4
        with:
          publish-dir: ./gkd-docs/.vitepress/dist
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
