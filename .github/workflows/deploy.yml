name: deploy

on:
  workflow_dispatch:
  push:
    branches: ['main']

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      - uses: pnpm/action-setup@v6

      - run: pnpm install

      - run: pnpm -F @gkd-kit/docs exec tsx ./.vitepress/scripts/updateVersion.ts

      - run: pnpm -F @gkd-kit/api run docs:build
      - run: pnpm -F @gkd-kit/docs run docs:build-mirror

      - run: pnpm -F @gkd-kit/docs publish --no-git-checks

      - run: >-
          pnpm dlx --allow-build=sharp --allow-build=workerd wrangler@4.118.0
          pages deploy ./docs/.vitepress/dist --project-name=gkd-docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: nwtgck/actions-netlify@v4
        with:
          publish-dir: ./docs/.vitepress/dist
          production-deploy: true
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
