name: deploy

on:
  workflow_dispatch:
  push:
    branches: ['main']

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      - uses: pnpm/action-setup@v6

      - run: pnpm install

      - run: pnpm -F @gkd-kit/docs exec tsx ./.vitepress/scripts/updateVersion.ts

      - run: pnpm -F @gkd-kit/api run docs:build
      - run: pnpm -F @gkd-kit/docs run docs:build-mirror

      - run: pnpm -F @gkd-kit/docs publish --no-git-checks

      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: gkd-docs
          directory: ./docs/.vitepress/dist

      - uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./docs/.vitepress/dist
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Deploy from GitHub Actions'
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
